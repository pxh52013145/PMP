[package]
name = "pixel-matrix-player"
version = "0.1.0"
description = "A highly customizable music player with pixel matrix UI"
authors = ["Pixel Matrix Player Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/pixel-matrix-player"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset", "system-tray", "dialog-confirm", "dialog-message", "dialog-ask", "fs-all", "dialog-open", "window-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-shadows = "0.2"
once_cell = "1.18"
base64 = "0.22"
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

# 音频处理
rodio = "0.17"
symphonia = { version = "0.5", features = ["all"] }
rustfft = { version = "6.4.1", default-features = false }
rubato = { version = "0.16", default-features = false }

# HTTP客户端（使用 rustls 避免依赖系统 OpenSSL）
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# 数据库
rusqlite = { version = "0.30", features = ["bundled"] }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
