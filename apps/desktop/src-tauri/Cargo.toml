[package]
name = "pixel-matrix-player"
version = "0.1.0"
description = "A highly customizable music player with pixel matrix UI"
authors = ["Pixel Matrix Player Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/pixel-matrix-player"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
zerovec = { version = "0.11.4", features = ["alloc"] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-open", "path-all", "protocol-asset", "system-tray", "fs-all", "window-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-shadows = "0.2"
once_cell = "1.18"
crossbeam-queue = "0.3"
rtrb = "0.3"
zerovec = { version = "0.11.4", features = ["alloc"] }
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.54", features = ["Foundation", "Media", "Media_Playback", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
libc = "0.2"

# 音频处理
rodio = "0.17"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
dsf = "0.2.2"
rustfft = { version = "6.4.1", default-features = false }
rubato = { version = "0.16", default-features = false }
ttf-parser = "0.25"

# HTTP客户端（使用 rustls 避免依赖系统 OpenSSL）
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

# 数据库
rusqlite = { version = "0.30", features = ["bundled"] }
gif = "0.14"
qrcode = "0.14"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
md5 = "0.7"
keyring = "2.3"
num-bigint = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
asio-sys = { version = "0.2.5", optional = true }
cpal = { version = "0.15", optional = true, features = ["asio"] }

[features]
default = []
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
asio-sdk = ["dep:asio-sys", "dep:cpal"]
nn-cuda = []

[[bin]]
name = "pixel-matrix-player"
path = "src/main.rs"
test = false

[patch.crates-io]
asio-sys = { path = "crates/asio-sys" }
