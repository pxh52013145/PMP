# Cargo 配置 - 加速编译

[build]
# 增加并行编译数（根据 CPU 核心数调整）
jobs = 8

[profile.dev]
# 开发模式优化
#
# NOTE: rustc 1.90 + Windows/MSVC 下，opt-level=1 会导致链接失败（LNK2001/LNK2019，drop_in_place...llvm.*）。
opt-level = 0        # 保持默认，确保 tauri dev / cargo build 稳定
debug = true         # 保留调试信息
incremental = true   # 增量编译

[profile.dev.package."*"]
# 依赖包使用更高优化级别（编译慢但运行快）
opt-level = 1
debug = 0

# Windows 专用配置
[target.x86_64-pc-windows-msvc]
# Windows 使用默认的 MSVC 链接器即可
# 不需要额外配置

# Linux 专用配置
# [target.x86_64-unknown-linux-gnu]
# 使用 mold 链接器加速（需要先安装 mold）
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS 专用配置
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=ld64.lld"]
